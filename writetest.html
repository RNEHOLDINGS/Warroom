<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Gemini writer test</title><link rel="stylesheet" href="styles.css"></head>
<body>
<div class="team-stripe"></div>
<header class="topbar">
  <button class="brand" data-view="home"><span class="brand-mark"></span><span class="brand-text"><span class="brand-school" id="brandSchool"></span><span class="brand-season" id="brandSeason"></span></span></button>
  <nav class="nav" id="nav">
    <button class="nav-btn" data-view="home">Needs</button><button class="nav-btn" data-view="roster">Roster</button>
    <button class="nav-btn" data-view="board">Board</button><button class="nav-btn" data-view="portal">Portal</button>
    <button class="nav-btn" data-view="class">Class</button><button class="nav-btn" data-view="show">Show</button>
  </nav>
  <button class="icon-toggle" data-view="settings" id="settingsBtn"></button>
  <button class="icon-toggle" id="themeToggle"></button>
</header>
<main id="view" class="view"></main>
<div id="modal" class="modal-backdrop" hidden></div>
<div id="toast" class="toast" hidden></div>
<pre id="printArea" class="print-only"></pre>
<pre id="out">RUNNING</pre>
<script>localStorage.clear();</script>
<script>
/* a stand-in for Google's writing model */
window.__calls = [];
var REAL_FETCH = window.fetch.bind(window);
/* What a finished episode looks like coming back: every segment in the
   running order, enough lines to be the show that was asked for. */
var SEGS = ['RUNDOWN', 'COLD OPEN', 'THE QUESTION', 'STOCK UP', 'THE HOT SEAT', 'THE NUMBERS', 'THE SWING',
  'THE OTHER SIDELINE', 'HELMET STICKERS', 'WHAT THE COACH SAID', 'THE STAFF', 'THE INSIDER',
  'WHAT’S COMING', 'FINAL TAKE', 'THE BIG FINISH'];
var SAYS = [
  'WHITCOMB: Welcome in. Oregon lost to Utah, 27 to 13.',
  'MABRY: I’m done making excuses for that offense.',
  'HARLAN: Twenty-one of thirty-eight, three picks. That’s the game.',
  'RIDENOUR: They’re still chasing a tackle in this class.',
  'WHITCOMB: Say that again, because I don’t think people heard it.',
  'MABRY: Yep.'
];
var FULL = '```\n' + SEGS.map(function (name, i) {
  return '--- SEGMENT ' + (i + 1) + ': ' + name + ' ---\n\n' +
    SAYS.map(function (l, j) { return (i === 9 && j === 0 ? 'COACH: J.Carty has to be better.' : l); }).join('\n\n');
}).join('\n\n') + '\n```';
/* Every segment present, two lines each: a complete show that is simply
   shorter than the setting asked for. Not a stub. */
var TERSE = SEGS.map(function (name, i) {
  return '--- SEGMENT ' + (i + 1) + ': ' + name + ' ---\n\n' + SAYS.slice(0, 2).join('\n\n');
}).join('\n\n');
var STUB = '--- SEGMENT 1: COLD OPEN ---\n\nWHITCOMB: Welcome in. Oregon lost to Utah, 27 to 13.\n\nMABRY: I’m done making excuses.\n\n' +
  '--- SEGMENT 2: THE NUMBERS ---\n\nHARLAN: Twenty-one of thirty-eight, three picks.\n\n' +
  '--- SEGMENT 3: FINAL TAKE ---\n\nWHITCOMB: That’s the show.';
window.__mode = 'ok';
window.fetch = function (url, init) {
  if (String(url).indexOf('generativelanguage.googleapis.com') < 0) return REAL_FETCH(url, init);
  if (/\/v1beta\/models\?/.test(String(url))) {
    window.__calls.push({ url: String(url), headers: init.headers, list: true });
    return Promise.resolve(new Response(JSON.stringify(window.__mode === 'badkey'
      ? { error: { code: 400, message: 'API key not valid. Please pass a valid API key.' } }
      : { models: [
          { name: 'models/gemini-9-flash', displayName: 'Gemini 9 Flash', supportedGenerationMethods: ['generateContent'] },
          { name: 'models/gemini-9-flash-tts', displayName: 'Gemini 9 Flash TTS', supportedGenerationMethods: ['generateContent'] },
          { name: 'models/embedding-001', displayName: 'Embedding', supportedGenerationMethods: ['embedContent'] }
        ] }), { status: window.__mode === 'badkey' ? 400 : 200, headers: { 'Content-Type': 'application/json' } }));
  }
  var body = JSON.parse(init.body);
  window.__calls.push({ url: String(url), headers: init.headers, body: body, signal: init.signal });
  return new Promise(function (res, rej) {
    if (init.signal) init.signal.addEventListener('abort', function () { var e = new Error('aborted'); e.name = 'AbortError'; rej(e); });
    setTimeout(function () {
      if (init.signal && init.signal.aborted) return;
      var reply = function (status, obj) { res(new Response(JSON.stringify(obj), { status: status, headers: { 'Content-Type': 'application/json' } })); };
      if (window.__mode === 'badkey') return reply(400, { error: { code: 400, message: 'API key not valid. Please pass a valid API key.' } });
      if (window.__mode === 'notfound') return reply(404, { error: { code: 404, message: 'models/x is not found for API version v1beta, or is not supported for generateContent.' } });
      var wantsAudio = ((body.generationConfig || {}).responseModalities || []).indexOf('AUDIO') >= 0;
      if (wantsAudio) {
        if (window.__mode === 'noaudio') return reply(200, { candidates: [{ content: { parts: [{ text: 'I cannot do that.' }] } }] });
        return reply(200, { candidates: [{ content: { parts: [{ inlineData: { mimeType: 'audio/L16;rate=24000', data: btoa(new Array(3000).join('a')) } }] } }] });
      }
      if (window.__mode === 'empty') return reply(200, { candidates: [{ content: { parts: [{ text: 'Sorry, I cannot help with that.' }] }, finishReason: 'STOP' }] });
      /* A model that ran out of room part-way: three segments, a handful of
         lines. This is what was being handed over as a finished show. */
      if (window.__mode === 'stub') return reply(200, { candidates: [{ content: { parts: [{ text: STUB }] }, finishReason: 'MAX_TOKENS' }] });
      if (window.__mode === 'terse') return reply(200, { candidates: [{ content: { parts: [{ text: TERSE }] }, finishReason: 'STOP' }] });
      if (window.__mode === 'nothink' && /thinkingConfig/.test(init.body)) {
        return reply(400, { error: { code: 400, message: 'Invalid JSON payload received. Unknown name "thinkingConfig" at \'generation_config\'.', status: 'INVALID_ARGUMENT' } });
      }
      reply(200, { candidates: [{ content: { parts: [{ text: FULL }] }, finishReason: 'STOP' }] });
    }, 10);
  });
};
</script>
<script src="voice.js"></script>
<script src="app.js"></script>
<script>
/* The built-in writer stays the default. Switching the model on hands the
   facts to Google and puts what comes back in the box -- with the producer
   notes re-attached, so nothing invented can pass as a fact. */
(function () {
  var out = [], fails = 0;
  function render() { document.getElementById('out').textContent = out.join('\n'); }
  function ok(c, n, d) { out.push((c ? 'PASS ' : 'FAIL ') + n + (c ? '' : '  -- ' + (d || ''))); if (!c) fails++; render(); }
  function q(s) { return document.querySelector(s); }
  function click(sel) { var el = q(sel); if (!el) { ok(false, 'element ' + sel, 'missing'); return null; } el.click(); return el; }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function finish() {
    out.push(fails ? 'RESULT FAIL ' + fails : 'RESULT PASS'); render();
    try { localStorage.setItem('warroom.testresult', out.join(String.fromCharCode(10))); } catch (e) {}
    window.__done = true;
    if (location.search.indexOf('close') >= 0) setTimeout(function () { window.close(); }, 300);
  }
  var W = window.WarRoom, V = window.WarRoomVoice;
  var g;
  Promise.resolve().then(function () {
    click('[data-action="load-sample"]');
    var st = W.state();
    st.school = { name: 'Oregon', mascot: 'Ducks', state: 'OR', color: '#154733' };
    st.quarterLen = 5;
    st.games = []; st.schedule = []; st.rivals = [];
    st.players = [{ id: 'qb1', name: 'J.Carty', pos: 'QB', year: 'JR', ovr: 82, exit: '' }];
    st.show = { title: 'HARD COUNT', host: 'Dale Whitcomb', player: 'Terrance Mabry', analyst: 'Kelsey Harlan', insider: 'Nate Ridenour', useInsider: true };
    st.schedule.push({ id: 's1', season: st.season, week: 7, opponent: 'Washington', home: false, rank: 9, rivalry: false, bye: false, note: '' });
    g = { id: 'g1', season: st.season, week: 6, opponent: 'Utah', home: false, result: 'L', scoreFor: 13, scoreAgainst: 27,
      rushFor: 85, rushAgainst: 170, passFor: 240, passAgainst: 210, toFor: 3, toAgainst: 0,
      tdFor: 1, tdAgainst: 3, rushAttFor: 22, passAttFor: 38, qbChange: true,
      coachQuote: 'J.Carty has to be better. Expect a position battle next week.', coachTags: ['callout', 'changes'],
      bigPlay: '', injury: '', notes: '',
      performances: [{ name: 'J.Carty', pos: 'QB', line: '21/38, 240 yds, 1 TD, 3 INT', verdict: 'standout' }] };
    st.games.push(g);

    /* --- the brief --- */
    var b = W.showBrief(g);
    ok(b.game.opponent === 'Utah' && b.game.scoreAgainst === 27 && b.team.name === 'Oregon', 'the brief carries the game', JSON.stringify(b.game.result + ' ' + b.game.scoreFor + '-' + b.game.scoreAgainst));
    ok(b.players[0].grade === 0 && /other team more than he threw it to his own/.test(b.players[0].combinationsThatCapIt.join(' ')), 'and the grade with the combination that caps it', JSON.stringify(b.players[0].combinationsThatCapIt));
    ok(b.players[0].verdictDisputed === true, 'and flags a verdict the numbers do not support');
    ok(b.staffCase.length > 0 && b.staffCase[0].theFix, 'the charges against the staff come with their fixes', b.staffCase[0] && b.staffCase[0].what);
    ok(b.coach && b.coach.quote === g.coachQuote && b.coach.meaning.length > 0, 'the coach’s quote and what it means', JSON.stringify(b.coach && b.coach.meaning));
    ok(b.schedule && b.schedule.next === 'Washington' && b.schedule.nextRank === 9, 'who is next week');
    ok(b.cast.some(function (c) { return c.label === 'COACH'; }), 'and the coach is listed as a voice');
    ok(JSON.stringify(b).indexOf('Welcome in') < 0, 'the brief is facts, with no dialogue in it');

    /* --- the prompt --- */
    var p = V.writePrompt(b);
    ok(/WHITCOMB, MABRY, HARLAN, RIDENOUR, COACH/.test(p), 'the prompt pins the speaker labels', (p.match(/using exactly these labels.*/) || [''])[0]);
    ok(/Never invent a statistic/.test(p) && /that is not X, that is Y/.test(p), 'and forbids invented facts and the twist construction');
    ok(/says exactly the quote given below, word for word/.test(p), 'and that the coach is a clip, not a guest');
    ok(p.indexOf('"scoreAgainst": 27') >= 0 || p.indexOf('"scoreAgainst":27') >= 0, 'and the facts are in there');

    /* --- off by default --- */
    ok(W.showCfg().writeModel === '', 'the built-in writer is the default');
    W.setView('show');
    click('[data-action="script"][data-id="g1"]');
    ok(!q('[data-action="write-script"]'), 'so there is no Gemini button until you switch it on');
    click('[data-action="close"]');

    /* --- switch it on --- */
    W.setView('settings');
    ok(!!q('#sh-write'), 'Settings has the choice of who writes it');
    q('#sh-key').value = 'TEST-KEY-123';
    q('#sh-write').value = 'gemini-2.5-flash';
    click('[data-action="save-show"]');
    ok(W.showCfg().writeModel === 'gemini-2.5-flash', 'which saves', W.showCfg().writeModel);

    W.setView('show');
    click('[data-action="script"][data-id="g1"]');
    ok(!!q('[data-action="write-script"]'), 'and the button appears');
    var before = q('#scriptBox').value;
    ok(/HARD COUNT/.test(before), 'the built-in script is in the box to start with');
    click('[data-action="write-script"]');
    return sleep(400).then(function () {
      var call = window.__calls[0];
      ok(window.__calls.length === 1, 'one request to write it', window.__calls.length);
      ok(/gemini-2\.5-flash:generateContent$/.test(call.url), 'to the chosen text model', call.url);
      ok(call.headers['x-goog-api-key'] === 'TEST-KEY-123', 'with the same key as the voices');
      ok(!call.body.generationConfig.responseModalities, 'and it asks for text, not audio');

      /* Thinking is spent out of maxOutputTokens, so a model that thought
         hard about a long brief had nothing left to write with. Asking for
         the longest show was producing the shortest one. */
      var cfg = call.body.generationConfig, prompt = call.body.contents[0].parts[0].text;
      ok(cfg.thinkingConfig && cfg.thinkingConfig.thinkingBudget > 0,
        'thinking is given an allowance of its own, since it comes out of the same pot as the script', JSON.stringify(cfg.thinkingConfig));
      ok(cfg.maxOutputTokens >= 5000, 'and the script is left real room on top of it', cfg.maxOutputTokens);

      /* The running order, instead of leaving it to the model: a show with
         twelve of its fifteen parts missing is most of what "a one minute
         show" was. */
      var order = ['RUNDOWN', 'COLD OPEN', 'THE QUESTION', 'STOCK UP', 'THE HOT SEAT', 'THE NUMBERS', 'FINAL TAKE', 'THE BIG FINISH'];
      ok(order.every(function (seg) { return prompt.indexOf(seg) >= 0; }),
        'the prompt names every segment rather than leaving the running order to the model',
        order.filter(function (seg) { return prompt.indexOf(seg) < 0; }).join(', ') || 'all present');
      ok(/Do not skip one, do not merge two, do not stop early/.test(prompt), 'and says not to skip them');

      /* Two voices to a segment. Not a style note: the speech engine takes
         two per take, so a third label inside a segment is an extra
         request, and on a free key requests are the scarce thing. */
      ok(/use only TWO of the labels/.test(prompt), 'the writer is told to keep a segment to two voices', (prompt.match(/.*only TWO of the labels.*/) || [''])[0]);
      ok(/Change the pair at the next segment header/.test(prompt), 'and to change the pair at a segment header, not mid-exchange');
      ok(/every panellist gets their share/.test(prompt), 'without anyone dropping off the show');
      ok(/COACH is one of the two voices/.test(prompt), 'and the coach clip counts as one of its two');
      var briefAt = prompt.indexOf('# WHAT HAPPENED'), nowAt = prompt.lastIndexOf('# NOW WRITE IT');
      ok(briefAt > 0 && nowAt > briefAt,
        'the job is restated after the brief, because thousands of characters of JSON sat between the instructions and the writing', briefAt + ' then ' + nowAt);
      ok(/spoken lines/.test(prompt.slice(nowAt)), 'including how long it should be', prompt.slice(nowAt, nowAt + 120));

      var now = q('#scriptBox').value;
      ok(/MABRY: I’m done making excuses/.test(now), 'what came back is in the box', now.slice(0, 120));
      ok(!/^```/.test(now.trim()), 'a code fence is stripped');
      ok(/PRODUCER NOTES/.test(now), 'and the producer notes are re-attached');
      ok(/21\/38, 240 yds, 1 TD, 3 INT/.test(now), 'so the real numbers are still there to check it against', (now.match(/Players:[\s\S]{0,80}/) || [''])[0]);
      ok(W.state().games[0].script === now, 'it is saved to the game');

      /* it is still a script the rest of the app understands */
      var turns = V.parseDialogue(now);
      ok(turns.length >= 5 && turns.every(function (t) { return ['WHITCOMB', 'MABRY', 'HARLAN', 'RIDENOUR', 'COACH'].indexOf(t.speaker) >= 0; }), 'and it voices like any other script', JSON.stringify(turns.map(function (t) { return t.speaker; })));
      ok(!turns.some(function (t) { return /Players:|Coach said:/.test(t.text); }), 'with the notes left unspoken');

      /* --- a refusal or an empty answer is reported, not saved --- */
      window.__calls = []; window.__mode = 'empty';
      var kept = q('#scriptBox').value;
      click('[data-action="write-script"]');
      return sleep(400).then(function () {
        ok(/without any dialogue in it/.test(q('#voiceArea').textContent), 'an answer with no dialogue in it is reported', q('#voiceArea').textContent);
        ok(q('#scriptBox').value === kept, 'and the script you had is untouched');

        window.__mode = 'badkey';
        click('[data-action="write-script"]');
        return sleep(400);
      });
    }).then(function () {
      ok(/rejected the API key/.test(q('#voiceArea').textContent), 'a bad key is reported in plain words', q('#voiceArea').textContent);

      /* --- a show that stopped early is not a short show --------------
         It used to be handed over as though the model had chosen to be
         brief. It had not. */
      window.__mode = 'stub'; window.__calls = [];
      click('[data-action="write-script"]');
      return sleep(400);
    }).then(function () {
      var txt = q('#voiceArea').textContent;
      ok(/\d+ lines across \d+ of \d+ segments/.test(txt), 'a script that stopped early is refused with the count', txt.slice(0, 200));
      ok(/ran out of room/.test(txt), 'and says it ran out of room, when that is what the model said happened', txt.slice(0, 200));
      ok(!!q('#voiceArea [data-action="write-script"]') && !!q('#voiceArea [data-action="use-short"]'),
        'with both things worth doing beside it: write it again, or keep what came back');
      ok(!/COLD OPEN/.test(q('#scriptBox').value) || /HARD COUNT/.test(q('#scriptBox').value),
        'and the script you already had is left alone until you say otherwise');

      var had = q('#scriptBox').value;
      click('#voiceArea [data-action="use-short"]');
      ok(q('#scriptBox').value !== had && /COLD OPEN/.test(q('#scriptBox').value), 'keeping it keeps it', q('#scriptBox').value.slice(0, 60));
      ok(W.state().games[0].script === q('#scriptBox').value, 'and saves it');

      /* --- a model that will not take a thinking budget --------------- */
      window.__mode = 'nothink'; window.__calls = [];
      click('[data-action="write-script"]');
      return sleep(600);
    }).then(function () {
      var tries = window.__calls.filter(function (c) { return c.body && c.body.contents; });
      ok(tries.length === 2, 'a model that refuses a thinking budget is asked once more without one, not reported as a failure', tries.length);
      ok(tries[0].body.generationConfig.thinkingConfig && !tries[1].body.generationConfig.thinkingConfig,
        'and only the budget is dropped, not everything else with it');
      ok(tries[1].body.generationConfig.maxOutputTokens === tries[0].body.generationConfig.maxOutputTokens, 'the room for the script is kept');
      ok(/SEGMENT 15/.test(q('#scriptBox').value), 'so the whole episode still arrives', q('#scriptBox').value.slice(0, 60));

      /* --- a complete show that came in short is kept, not thrown away ---
         Judging it on a fraction of the target meant that asking for a
         longer show started rejecting perfectly good episodes for the
         crime of being 30 lines instead of 90. */
      window.__mode = 'terse'; window.__calls = [];
      click('[data-action="write-script"]');
      return sleep(400);
    }).then(function () {
      var txt = q('#voiceArea').textContent;
      ok(/Written by/.test(txt), 'a show with all its segments is kept even when it is well under length', txt.slice(0, 120));
      ok(/came in at \d+ lines/.test(txt) && /complete show, just a shorter one/.test(txt), 'and it says so, instead of pretending it asked for that', txt.slice(0, 260));
      ok(/SEGMENT 15/.test(q('#scriptBox').value), 'the whole thing is in the box', q('#scriptBox').value.slice(-60));

      window.__mode = 'ok';
      click('[data-action="close"]');

      /* --- asking the key what it can actually use ------------------
       Guessed model names 404, and the error reads like the app is broken.
       The key knows the answer, so ask it. */
    W.setView('settings');
    window.__calls = [];
    click('[data-action="find-models"]');
    return sleep(400).then(function () {
      var call = window.__calls[0];
      ok(call && call.list && /\/v1beta\/models\?/.test(call.url), 'it asks Google for the list', call && call.url);
      ok(call.headers['x-goog-api-key'] === 'TEST-KEY-123', 'with the key');
      var found = W.showCfg().models;
      ok(found.length === 2 && found.every(function (m) { return m.writes; }), 'models that cannot answer a prompt are dropped', JSON.stringify(found.map(function (m) { return m.id; })));
      ok(found.some(function (m) { return m.id === 'gemini-9-flash-tts' && m.speaks; }), 'and the speaking ones are marked as such', JSON.stringify(found));
      ok(W.showCfg().model === 'gemini-9-flash-tts', 'a voice model the key does not have is swapped for one it does', W.showCfg().model);
      ok(W.showCfg().writeModel === 'gemini-9-flash', 'and so is the writer', W.showCfg().writeModel);
      var voiceOpts = Array.prototype.map.call(document.querySelectorAll('#sh-model option'), function (o) { return o.value; });
      var writeOpts = Array.prototype.map.call(document.querySelectorAll('#sh-write option'), function (o) { return o.value; });
      ok(voiceOpts.indexOf('gemini-9-flash-tts') >= 0 && voiceOpts.indexOf('gemini-9-flash') < 0, 'the voice list offers only the speaking ones', JSON.stringify(voiceOpts));
      ok(writeOpts.indexOf('gemini-9-flash') >= 0 && writeOpts.indexOf('') >= 0, 'the writer list offers the others, plus off', JSON.stringify(writeOpts));
      ok(/2 models found on your key/.test(q('#modelNote').textContent), 'and it says what it found', q('#modelNote').textContent);
      ok(JSON.parse(localStorage.getItem('warroom.v1')).show.models.length === 2, 'the list is remembered');

      /* a 404 now points at the fix */
      window.__mode = 'badkey';
      window.__calls = [];
      click('[data-action="find-models"]');
      return sleep(300);
    }).then(function () {
      ok(/rejected the API key/.test(q('#modelNote').textContent), 'a bad key says so here too', q('#modelNote').textContent);
      window.__mode = 'ok';

      /* --- testing a pick, instead of spending a show to find out --- */
      click('[data-action="test-voice"]');
      return sleep(300);
    }).then(function () {
      ok(/gemini-9-flash-tts works/.test(q('#voiceTest').textContent), 'one tap says whether the voice model works', q('#voiceTest').textContent);
      ok(/audio came back/.test(q('#voiceTest').textContent), 'and proves it by the audio, not by a 200', q('#voiceTest').textContent);
      var last = window.__calls[window.__calls.length - 1];
      ok(/gemini-9-flash-tts:generateContent/.test(last.url), 'it tests the model that is actually selected', last.url);
      ok(JSON.stringify(last.body).length < 400, 'with the smallest request it will take, so testing is nearly free', JSON.stringify(last.body).length);

      click('[data-action="test-write"]');
      return sleep(300);
    }).then(function () {
      ok(/gemini-9-flash works/.test(q('#writeTest').textContent) && /wrote back/.test(q('#writeTest').textContent), 'and whether the writer works', q('#writeTest').textContent);

      window.__mode = 'notfound';
      click('[data-action="test-voice"]');
      return sleep(300);
    }).then(function () {
      var m = q('#voiceTest').textContent;
      ok(/is not supported for generateContent/.test(m), 'a refusal keeps Google’s own sentence, which is the only thing that says which problem it is', m);
      ok(!/does not recognise that model/.test(m), 'and no longer sends you hunting for a model you never picked', m);

      window.__mode = 'noaudio';
      click('[data-action="test-voice"]');
      return sleep(300);
    }).then(function () {
      ok(/no audio in it/.test(q('#voiceTest').textContent), 'a model that answers in words is not a voice model', q('#voiceTest').textContent);
      window.__mode = 'ok';
    }).then(function () {

    /* --- the coach tags --- */
      W.setView('show');
      click('[data-action="edit-game"][data-id="g1"]');
      var tags = document.querySelectorAll('[data-ctag]');
      ok(tags.length >= 6, 'the game form has the coach tags', tags.length);
      ok(q('[data-ctag="callout"]').checked && q('[data-ctag="changes"]').checked, 'and remembers which were ticked');
      q('[data-ctag="callout"]').checked = false;
      q('[data-ctag="process"]').checked = true;
      click('[data-action="save-game"]');
      var tagged = W.state().games[0].coachTags;
      ok(tagged.indexOf('process') >= 0 && tagged.indexOf('callout') < 0, 'ticking changes what is stored', JSON.stringify(tagged));
      var read = W.readCoach(W.state().games[0], W.boxOf(g), 0.6, [], 'Oregon', 'Utah', g.performances);
      ok(read.hits.length === 2 && read.hits.every(function (h) { return ['process', 'changes'].indexOf(h.kind) >= 0; }), 'and the reader obeys the ticks instead of guessing', JSON.stringify(read.hits.map(function (h) { return h.kind; })));
      click('[data-action="close"]');
      finish();
    });
    });
  }).catch(function (e) { out.push('EXC ' + (e && e.stack || e)); fails++; finish(); });
})();
</script>
