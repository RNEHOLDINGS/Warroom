<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>War Room OCR accuracy test</title>
</head>
<body>
<pre id="out">RUNNING</pre>
<script src="ocr.js"></script>
<script>
(function () {
  var TRUTH = [
    ['Arch Manning',       'QB',   'JR', false, 92],
    ['Trey Owens',         'QB',   'SO', true,  78],
    ['Quintrevion Wisner', 'HB',   'SR', false, 87],
    ['Christian Clark',    'HB',   'FR', true,  74],
    ['Ryan Wingo',         'WR',   'SO', false, 85],
    ['DeAndre Moore',      'WR',   'JR', false, 83],
    ['Parker Livingstone', 'WR',   'FR', true,  76],
    ['Jack Endries',       'TE',   'SR', false, 84],
    ['Nick Townsend',      'TE',   'JR', true,  71],
    ['Trevor Goosby',      'LT',   'JR', false, 86],
    ['DJ Campbell',        'RG',   'SR', false, 88],
    ['Cole Hutson',        'C',    'JR', false, 85],
    ['Brandon Baker',      'RT',   'SO', true,  79],
    ['Nick Brooks',        'LG',   'FR', false, 68]
  ];

  var lines = [];
  function say(s) { lines.push(s); document.getElementById('out').textContent = lines.join('\n'); }

  /* Levenshtein, so "Quintrevion" vs "Quintrevlon" still matches the right man. */
  function dist(a, b) {
    a = a.toLowerCase(); b = b.toLowerCase();
    var m = a.length, n = b.length, prev = [], cur = [], i, j;
    for (j = 0; j <= n; j++) prev[j] = j;
    for (i = 1; i <= m; i++) {
      cur[0] = i;
      for (j = 1; j <= n; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      }
      prev = cur.slice();
    }
    return prev[n];
  }

  function score(label, rows) {
    var matched = 0, posOK = 0, yearOK = 0, rsOK = 0, ovrOK = 0, exact = 0;
    var misses = [];
    TRUTH.forEach(function (t) {
      var best = null, bestD = 99;
      rows.forEach(function (r) {
        var d = dist(t[0], r.name);
        if (d < bestD) { bestD = d; best = r; }
      });
      /* a match is a name within 25% edit distance */
      if (!best || bestD > Math.max(2, Math.ceil(t[0].length * 0.25))) { misses.push('MISSING  ' + t[0]); return; }
      matched++;
      var p = best.pos === t[1], y = best.year === t[2], rs = best.rs === t[3], o = best.ovr === t[4];
      if (p) posOK++; if (y) yearOK++; if (rs) rsOK++; if (o) ovrOK++;
      if (p && y && rs && o && bestD === 0) exact++;
      else {
        misses.push('DIFF     truth[' + t.join(' ') + ']  read[' + best.name + ' ' + best.pos + ' ' + best.year + ' rs=' + best.rs + ' ' + best.ovr + ']' + (bestD ? ' nameEdits=' + bestD : ''));
      }
    });
    var spurious = rows.length - matched;
    say('');
    say('=== ' + label + ' ===');
    say('rows read: ' + rows.length + '   players found: ' + matched + '/' + TRUTH.length + '   spurious rows: ' + spurious);
    say('position ' + posOK + '/' + TRUTH.length + '   year ' + yearOK + '/' + TRUTH.length + '   redshirt ' + rsOK + '/' + TRUTH.length + '   overall ' + ovrOK + '/' + TRUTH.length + '   perfect rows ' + exact + '/' + TRUTH.length);
    misses.forEach(function (m) { say('  ' + m); });
    return { matched: matched, exact: exact, posOK: posOK, yearOK: yearOK, rsOK: rsOK, ovrOK: ovrOK, spurious: spurious };
  }

  /* parser-only checks first: these must hold regardless of the engine */
  function unit() {
    /* Real CFB 27 depth-chart rows: # RS NAME YEAR POS OVR NIL then stats. */
    var cases = [
      ['1 J.Carty SO (RS) LT 86 15 64 74 84 62 86 95 85',  'J.Carty', 'LT', 'SO', true, 86],
      ['2 C.Hamm SR (RS) RT 83 10 72 73 90 60 82 88 93',   'C.Hamm', 'RT', 'SR', true, 83],
      ['- C.Doucet SO LG 85 95 74 80 81 68 91 82 80',      'C.Doucet', 'LG', 'SO', false, 85],
      ['3 D.Tuten SO HB 78 0 83 85 88 97 72 80 69',        'D.Tuten', 'HB', 'SO', false, 78],
      ['1 B.Chavez JR (RS) P 82 10 90 87 67 24 78 44 69',  'B.Chavez', 'P', 'JR', true, 82],
      ['- M.Dillard SO (RS) WILL 81 0 90 82 83 72 68 74 93','M.Dillard','WILL','SO', true, 81],
      ['16 Arch Manning QB JR 92 Elite',        'Arch Manning', 'QB', 'JR', false, 92],
      ['4 Trey Owens QB RS SO 78 Star',         'Trey Owens',   'QB', 'SO', true,  78],
      ['74 Trevor Goosby LT JR 86 Impact',      'Trevor Goosby','LT', 'JR', false, 86],
      ['77 Cole Hutson C JR 85 Normal',         'Cole Hutson',  'C',  'JR', false, 85],
      ['26 Christian Clark HB RS FR 74 Normal', 'Christian Clark','HB','FR', true,  74],
      ['1 Ryan Wingo WR SO 85 Star',            'Ryan Wingo',   'WR', 'SO', false, 85],
      ['77 Cole Hutson Cc JR 85 Normal',        'Cole Hutson',  'C',  'JR', false, 85],
      ['9 Some Punter Pp SR 70 Normal',         'Some Punter',  'P',  'SR', false, 70],
      ['21 Real Safety SS JR 80 Star',          'Real Safety',  'SS', 'JR', false, 80],
      ['3 John Mike Smith QB JR 88 Star',       'John Mike Smith','QB','JR', false, 88],
      ['55 Marcus Guard MIKE SR 82 Impact',     'Marcus Guard', 'MIKE','SR', false, 82],
      ['8 Will Sam Long WILL RS JR 77 Normal',  'Will Sam Long','WILL','JR', true, 77]
    ];
    var bad = 0;
    cases.forEach(function (c) {
      var r = window.WarRoomOCR.parseLine(c[0]);
      var okRow = r && r.name === c[1] && r.pos === c[2] && r.year === c[3] && r.rs === c[4] && r.ovr === c[5];
      if (!okRow) { bad++; say('UNIT FAIL ' + c[0] + ' -> ' + JSON.stringify(r)); }
    });
    /* junk must not become players */
    ['Texas Longhorns Roster', 'Offense Page 1 of 4', '# Name Pos Yr Ovr Dev', '', '   '].forEach(function (j) {
      var r = window.WarRoomOCR.parseLine(j);
      if (r) { bad++; say('UNIT FAIL junk accepted: "' + j + '" -> ' + JSON.stringify(r)); }
    });
    say('unit parser: ' + (bad ? bad + ' FAILURES' : 'all pass'));
    return bad;
  }

  var unitBad = unit();

  window.WarRoomOCR.recognize('test-roster-clean.png', function (s, p) {
    document.title = s + ' ' + Math.round(p * 100);
  }).then(function (res) {
    say('');
    say('--- raw text, clean screenshot ---');
    say(res.text.replace(/\n{2,}/g, '\n').trim());
    var a = score('CLEAN SCREENSHOT', res.rows);
    return window.WarRoomOCR.recognize('test-roster-photo.png').then(function (res2) {
      say('');
      say('--- raw text, simulated phone photo ---');
      say(res2.text.replace(/\n{2,}/g, '\n').trim());
      var b = score('PHONE PHOTO OF A TV', res2.rows);
      say('');
      say('RESULT unitFailures=' + unitBad + ' cleanExact=' + a.exact + '/' + TRUTH.length + ' photoExact=' + b.exact + '/' + TRUTH.length);
      say('DONE');
      window.__done = true;
      try { localStorage.setItem('warroom.testresult', lines.join(String.fromCharCode(10))); } catch (e) {}
      if (location.search.indexOf('close') >= 0) setTimeout(function () { window.close(); }, 300);
    });
  }).catch(function (e) {
    say('EXC ' + (e && e.stack || e));
    say('DONE');
    window.__done = true;
    try { localStorage.setItem('warroom.testresult', lines.join(String.fromCharCode(10))); } catch (err) {}
    if (location.search.indexOf('close') >= 0) setTimeout(function () { window.close(); }, 300);
  });
})();
</script>
</body>
</html>
