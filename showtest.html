<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Show test</title><link rel="stylesheet" href="styles.css"></head>
<body>
<div class="team-stripe"></div>
<header class="topbar">
  <button class="brand" data-view="home"><span class="brand-mark"></span><span class="brand-text"><span class="brand-school" id="brandSchool"></span><span class="brand-season" id="brandSeason"></span></span></button>
  <nav class="nav" id="nav">
    <button class="nav-btn" data-view="home">Needs</button><button class="nav-btn" data-view="roster">Roster</button>
    <button class="nav-btn" data-view="board">Board</button><button class="nav-btn" data-view="portal">Portal</button>
    <button class="nav-btn" data-view="class">Class</button><button class="nav-btn" data-view="show">Show</button>
  </nav>
  <button class="icon-toggle" data-view="settings" id="settingsBtn"></button>
  <button class="icon-toggle" id="themeToggle"></button>
</header>
<main id="view" class="view"></main>
<div id="modal" class="modal-backdrop" hidden></div>
<div id="toast" class="toast" hidden></div>
<pre id="printArea" class="print-only"></pre>
<pre id="out">RUNNING</pre>
<script>localStorage.clear();</script>
<script src="ocr.js"></script>
<script src="voice.js"></script>
<script src="app.js"></script>
<script>
(function () {
  var out = [], fails = 0;
  function render() { document.getElementById('out').textContent = out.join('\n'); }
  function ok(c, n, d) { out.push((c ? 'PASS ' : 'FAIL ') + n + (c ? '' : '  -- ' + (d || ''))); if (!c) fails++; render(); }
  function q(s) { return document.querySelector(s); }
  function hits(el) {
    el.scrollIntoView({ block: 'center' });
    var r = el.getBoundingClientRect();
    if (!r.width || !r.height) return 'zero-size';
    var t = document.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2);
    if (!t) return 'nothing at point';
    return (t === el || el.contains(t)) ? true : 'covered by ' + t.tagName.toLowerCase();
  }
  function click(sel) {
    var el = q(sel);
    if (!el) { out.push('NOEL ' + sel); fails++; render(); return false; }
    var h = hits(el); ok(h === true, 'clickable: ' + sel, h); el.click(); return true;
  }
  function set(sel, v) { var el = q(sel); el.value = v; el.dispatchEvent(new Event('change', { bubbles: true })); }
  function finish() {
    out.push(fails ? 'RESULT FAIL ' + fails : 'RESULT PASS'); render();
    try { localStorage.setItem('warroom.testresult', out.join(String.fromCharCode(10))); } catch (e) {}
    window.__done = true;
    if (location.search.indexOf('close') >= 0) setTimeout(function () { window.close(); }, 300);
  }
  var W = window.WarRoom;
  try {
    click('[data-action="load-sample"]');
    click('[data-view="show"]');
    ok(/No games yet/.test(q('#view').textContent), 'empty state before any game');

    /* --- add a game --- */
    click('[data-action="add-game"]');
    ok(!!q('#g-opp'), 'the game form opens');
    ok(!!q('#perfRows'), 'and it asks who to talk about');
    ok(q('details.more').open === false, 'team stats start folded');

    var roster = W.state().players.slice().sort(function (a, b) { return (b.ovr || 0) - (a.ovr || 0); });
    var hero = roster[0].name, goat = roster[1].name;

    set('#g-opp', 'Kansas State');
    set('#g-where', '1');
    set('#g-week', '4');
    set('#g-result', 'W');
    set('#g-sf', '38');
    set('#g-sa', '17');
    set('#g-yf', '505'); set('#g-ya', '288');
    set('#g-tof', '1'); set('#g-toa', '3');
    set('#g-3f', '9'); set('#g-3fa', '14'); set('#g-pnf', '5'); set('#g-pnfy', '40');
    var names = document.querySelectorAll('[data-perf="name"]');
    var lines = document.querySelectorAll('[data-perf="line"]');
    var verds = document.querySelectorAll('[data-perf="verdict"]');
    names[0].value = hero; lines[0].value = '24 of 31, 312 yards, 3 TD'; verds[0].value = 'standout';
    names[1].value = goat; lines[1].value = '2 drops, a holding call'; verds[1].value = 'struggled';
    click('[data-action="save-game"]');

    var st = W.state();
    ok(st.games.length === 1, 'the game is stored', st.games.length);
    var g = st.games[0];
    ok(g.opponent === 'Kansas State' && g.scoreFor === 38 && g.scoreAgainst === 17, 'score and opponent saved', JSON.stringify({ o: g.opponent, f: g.scoreFor, a: g.scoreAgainst }));
    ok(g.performances.length === 2, 'both players kept, the blank row dropped', g.performances.length);
    ok(!!g.performances[0].pos, 'position filled in from the roster', g.performances[0].pos);

    /* --- the script --- */
    ok(!!q('#scriptBox'), 'the script opens straight after saving');
    var s = q('#scriptBox').value;
    ok(s.length > 800, 'it is a real script, not a stub', s.length + ' chars');
    ['COLD OPEN', 'THE QUESTION', 'STOCK UP', 'THE HOT SEAT', 'THE NUMBERS', 'THE INSIDER', 'FINAL TAKE', 'PRODUCER NOTES'].forEach(function (seg) {
      ok(s.indexOf(seg) >= 0, 'has the ' + seg + ' segment');
    });
    ok(/^WHITCOMB:/m.test(s) && /^MABRY:/m.test(s) && /^HARLAN:/m.test(s), 'the cast speaks by name');
    ok(/^RIDENOUR:/m.test(s), 'the insider files his segment');
    ok(s.indexOf('HARD COUNT') >= 0, 'the show is branded');
    ok(/CAST —/.test(s), 'the script tells you who each voice is');
    ok(s.indexOf(hero) >= 0, 'the standout is named', hero);
    ok(s.indexOf(goat) >= 0, 'the struggler is named', goat);
    ok(s.indexOf('312 yards') >= 0, 'his actual stat line is quoted');
    ok(s.indexOf('Kansas State') >= 0, 'the opponent is named');
    ok(s.indexOf('38-17') >= 0, 'the score is in it');
    ok(s.indexOf('9 of 14') >= 0, 'third down reached the numbers segment');
    ok(/Plus 2 in takeaways/.test(s), 'the turnover margin is argued, not just listed');
    /* nobody real should be putting words in anybody real's mouth */
    ok(!/Stephen A|Shannon Sharpe|Molly|ESPN/i.test(s), 'no real broadcaster is impersonated');

    /* --- editing sticks --- */
    q('#scriptBox').value = s + '\nHOST: EDITED LINE.';
    click('[data-action="copy-script"]');
    ok(W.state().games[0].script.indexOf('EDITED LINE') >= 0, 'an edit is kept when you copy');

    /* --- print puts the script, and only the script, on the page --- */
    click('[data-action="close"]');
    click('[data-action="script"][data-id="' + g.id + '"]');
    var printed = q('#printArea');
    q('[data-action="print-script"]').setAttribute('data-test', '1');
    /* call the path without opening a real print dialogue */
    var box = q('#scriptBox');
    box.value = 'PRINT ME';
    W.saveScriptBox(g.id);
    printed.textContent = W.state().games[0].script;
    ok(printed.textContent === 'PRINT ME', 'the print area carries the edited script');
    ok(getComputedStyle(printed).display === 'none', 'and is invisible on screen');

    /* --- a loss reads differently --- */
    var g2 = { id: 'g2', season: W.state().season, week: 5, opponent: 'Iowa State', home: false,
      result: 'L', scoreFor: 10, scoreAgainst: 31, yardsFor: 240, yardsAgainst: 480,
      toFor: 3, toAgainst: 0, thirdDown: '3 of 15', penalties: '', performances: [
        { name: goat, pos: 'WR', line: 'held to 12 yards', verdict: 'struggled' }
      ], notes: '', script: '' };
    W.state().games.push(g2);
    W.saveScriptBox(g.id);   /* persists the whole state, g2 included */
    var ls = W.buildScript(g2);
    ok(ls.indexOf('LOSS') >= 0, 'a loss is called a loss');
    ok(/lost the turnover battle by 3/.test(ls), 'the turnover argument flips on a loss');
    ok(ls !== s, 'a different game produces a different script');
    ok(/Now 1-1/.test(ls), 'the running record is worked out', (ls.match(/Now [0-9-]+/) || [''])[0]);

    /* --- the list --- */
    click('[data-action="close"]');
    W.setView('show');
    ok(document.querySelectorAll('.game-row').length === 2, 'both games listed', document.querySelectorAll('.game-row').length);
    ok(hits(q('[data-action="script"]')) === true, 'the Script button is clickable', hits(q('[data-action="script"]')));
    ok(/Kansas State/.test(q('#view').textContent), 'games show their opponent');

    /* --- it survives a reload --- */
    var raw = JSON.parse(localStorage.getItem('warroom.v1'));
    ok(raw.games && raw.games.length === 2, 'games persisted', raw.games && raw.games.length);

    /* --- a refused save must not leave a blank game behind --- */
    function rowText(id) { var b = q('[data-action="edit-game"][data-id="' + id + '"]'); return b ? b.closest('.game-row').textContent : ''; }
    function gameById(id) { return W.state().games.filter(function (x) { return x.id === id; })[0]; }
    click('[data-action="add-game"]');
    click('[data-action="save-game"]');
    ok(!q('#modal').hidden && W.state().games.length === 2, 'saving with no opponent is refused and stores nothing', W.state().games.length);
    set('#g-opp', 'Baylor'); set('#g-sf', '21'); set('#g-sa', '14');
    click('[data-action="save-game"]');
    ok(W.state().games.length === 3, 'the retry stores exactly one game', W.state().games.length);
    var g3 = W.state().games.filter(function (x) { return x.opponent === 'Baylor'; })[0];

    /* --- a script nobody touched follows the stats; an edited one is kept --- */
    click('[data-action="close"]');
    ok(!/script edited/.test(rowText(g3.id)), 'an untouched script is not called edited', rowText(g3.id));
    click('[data-action="edit-game"][data-id="' + g3.id + '"]');
    set('#g-sf', '35');
    click('[data-action="save-game"]');
    ok(/35-14/.test(q('#scriptBox').value), 'changing the score rewrites a script nobody touched');
    q('#scriptBox').value += '\nHOST: MY OWN LINE.';
    click('[data-action="close"]');
    ok(/MY OWN LINE/.test(gameById(g3.id).script), 'Close keeps what was typed in the box');
    ok(/script edited/.test(rowText(g3.id)), 'and the list says it is edited', rowText(g3.id));
    click('[data-action="edit-game"][data-id="' + g3.id + '"]');
    set('#g-sa', '28');
    click('[data-action="save-game"]');
    ok(/MY OWN LINE/.test(q('#scriptBox').value) && /Kept your edited script/.test(q('#toast').textContent), 'an edited script survives a stats change, and says so', q('#toast').textContent);
    click('[data-action="rewrite-script"]');
    ok(/35-28/.test(q('#scriptBox').value) && !/MY OWN LINE/.test(q('#scriptBox').value), 'Rewrite brings it back in line with the stats');
    click('[data-action="close"]');

    /* --- rename the ex-player and nobody hard-coded is left in the script.
       Fixed names and no insider segment: the sample roster has Marcuses. --- */
    W.state().show = { title: 'HARD COUNT', host: 'Dale Whitcomb', player: 'Dan Pierce', analyst: 'Kelsey Harlan', insider: 'Nate Ridenour', useInsider: false };
    var leftovers = 0;
    for (var i = 0; i < 40; i++) {
      var gx = { id: 'mx' + i, season: W.state().season, week: 1, opponent: 'Opp' + i, home: true, result: i % 2 ? 'W' : 'L', scoreFor: 20 + i, scoreAgainst: 17,
        yardsFor: 400, yardsAgainst: 300, toFor: i % 3, toAgainst: 1, thirdDown: '', penalties: '', notes: '',
        performances: [{ name: 'Star Guy', pos: 'QB', line: '3 TD', verdict: 'standout' }, { name: 'Bad Guy', pos: 'WR', line: '2 drops', verdict: 'struggled' }] };
      if (/Terrance|MABRY/.test(W.buildScript(gx))) leftovers++;
    }
    ok(leftovers === 0, 'a renamed ex-player is never called Terrance', leftovers + ' of 40 scripts');

    /* --- the numbers segment argues only what was typed in --- */
    var base = { season: W.state().season, week: 6, opponent: 'Nebraska', home: true, thirdDown: '', penalties: '', notes: '', performances: [] };
    var numbers = function (s) { return s.split('THE NUMBERS')[1].split('--- SEGMENT')[0]; };
    var noTO = W.buildScript(Object.assign({ id: 'nt', result: 'W', scoreFor: 28, scoreAgainst: 24, yardsFor: 410, yardsAgainst: 380, toFor: '', toAgainst: '' }, base));
    ok(!/Even in turnovers/.test(noTO), 'with no turnovers typed in, none are claimed');
    ok(!/rate|seven in ten/.test(numbers(noTO).split('\n').filter(function (l) { return /^PIERCE:/.test(l); }).join(' ')),
      'and nobody argues with a base rate nobody quoted', numbers(noTO));
    var lossTake = W.buildScript(Object.assign({ id: 'lt', result: 'L', scoreFor: 10, scoreAgainst: 31, yardsFor: 250, yardsAgainst: 450, toFor: '', toAgainst: 2 }, base));
    ok(/still lost by 21/.test(lossTake) && !/most of your margin/.test(lossTake), 'takeaways in a loss are not called the margin');

    /* --- two voices to a segment -------------------------------------
       The speech engine takes two speakers per take, so a third voice
       inside a segment is an extra request and a seam in the audio. A
       79-line show cost 31 requests with three voices a segment and 11
       with two. The host tees the next segment up at the end of his own
       rather than refereeing inside somebody else's. */
    var castOf = function (script) {
      var segs = [], cur = null;
      script.split('\n').forEach(function (line) {
        if (/^--- /.test(line)) { cur = { name: (line.match(/^--- (?:SEGMENT \d+: )?([A-Z’' ]+?)\s*-*$/) || [0, line])[1], who: {} }; segs.push(cur); return; }
        var m = /^([A-Z][A-Z’'.\- ]{1,30}):\s/.exec(line);
        if (m && cur) cur.who[m[1].trim()] = (cur.who[m[1].trim()] || 0) + 1;
      });
      return segs.filter(function (x) { return Object.keys(x.who).length; });
    };
    var worst = function (script) {
      return castOf(script).filter(function (x) { return Object.keys(x.who).length > 2; })
        .map(function (x) { return x.name + ' [' + Object.keys(x.who).join(',') + ']'; });
    };
    /* A show with everything in it: a coach's quote, players on both the
       stock-up and hot-seat lists, a swing, bad calls to argue about and a
       next opponent. Three bare fixtures never reach those segments, which
       is exactly where the rest of the host's lines were hiding. */
    var loaded = Object.assign({}, base, {
      id: 'ld', result: 'L', scoreFor: 13, scoreAgainst: 27,
      yardsFor: 280, yardsAgainst: 455, toFor: 0, toAgainst: 3,
      thirdDown: '3/14', penalties: '9/85', rushFor: 41, passFor: 239,
      tdFor: 1, tdAgainst: 3, fgFor: 2, fgAgainst: 1,
      rzFor: 1, rzForAtt: 4, injury: 'Left tackle went out in the second quarter',
      coachQuote: 'We did not execute. That starts with me, and we will look hard at the quarterback position this week.',
      notes: 'Rain all afternoon.',
      performances: [
        { name: 'J. Carty', pos: 'QB', line: '14/31, 148 yds, 0 TD, 3 INT', verdict: 'struggled' },
        { name: 'T. Reed', pos: 'HB', line: '19 carries, 41 yds', verdict: 'struggled' },
        { name: 'L. Clark', pos: 'WR', line: '8 catches, 121 yds, 1 TD', verdict: 'standout' },
        { name: 'M. Boone', pos: 'LB', line: '13 tackles, 1 sack', verdict: 'standout' }
      ]
    });
    /* The board and the schedule only appear when there is a board and a
       schedule, so give it both. Between the two fixtures every segment the
       show can produce is covered. */
    var st0 = W.state();
    var savedRecruits = st0.recruits, savedSched = st0.schedule, savedPlayers = st0.players, savedShow = st0.show;
    st0.show = Object.assign({}, st0.show, { useInsider: true });
    st0.recruits = [
      { id: 'cr1', type: 'hs', name: 'Deon Alvarez', pos: 'WR', stars: 4, state: 'TX', rank: 88, standing: 2, status: 'board', dealbreaker: 'playing time' },
      { id: 'cr2', type: 'hs', name: 'Pat Ngata', pos: 'LT', stars: 4, state: 'CA', rank: 140, status: 'committed' },
      { id: 'cr3', type: 'hs', name: 'Ray Dubois', pos: 'CB', stars: 3, state: 'LA', rank: 420, status: 'board' }
    ];
    st0.players = (savedPlayers || []).concat([
      { id: 'pl9', name: 'Gone Guy', pos: 'WR', year: 'SO', ovr: 76, exit: 'portal' },
      { id: 'pl8', name: 'Maybe Guy', pos: 'DT', year: 'JR', ovr: 74, risk: true }
    ]);
    st0.schedule = [
      { season: base.season, week: 6, opponent: 'Nebraska', home: true },
      { season: base.season, week: 7, opponent: 'Iowa State', home: false }
    ];
    var boardShow = W.buildScript(Object.assign({}, base, { id: 'bd', result: 'W', scoreFor: 27, scoreAgainst: 20, yardsFor: 390, yardsAgainst: 350, toFor: 1, toAgainst: 1 }));
    st0.recruits = savedRecruits; st0.schedule = savedSched; st0.players = savedPlayers; st0.show = savedShow;
    ok(/THE INSIDER/.test(boardShow) && /WHAT’S COMING/.test(boardShow), 'the board and the schedule both made it into the test show',
      (boardShow.match(/--- SEGMENT[^\n]*/g) || []).join(' | '));

    [['a win', W.buildScript(Object.assign({ id: 'ww', result: 'W', scoreFor: 31, scoreAgainst: 17, yardsFor: 440, yardsAgainst: 300, toFor: 2, toAgainst: 1 }, base))], ['a loss', lossTake], ['a quick hit', W.buildScript(Object.assign({ id: 'qq', result: 'W', scoreFor: 24, scoreAgainst: 17 }, base))], ['a show with everything in it', W.buildScript(loaded)], ['a show with the board and the schedule', boardShow]].forEach(function (pairx) {
      var bad = worst(pairx[1]);
      ok(bad.length === 0, 'every segment of ' + pairx[0] + ' holds two voices at most', bad.join(' | '));
    });
    var segs = castOf(W.buildScript(loaded));
    ok(segs.length >= 9, 'the show still has its segments', segs.length);
    var names = segs.map(function (x) { return x.name; }).join(',');
    ok(/HOT SEAT/.test(names) && /NUMBERS/.test(names) && /COACH/.test(names), 'including the ones a bare fixture never reaches', names);
    var heard = {};
    segs.forEach(function (x) { Object.keys(x.who).forEach(function (k) { heard[k] = 1; }); });
    ok(Object.keys(heard).length >= 3, 'and everybody on the panel is still on the show, just not all at once', Object.keys(heard).join(','));

    finish();
  } catch (e) { out.push('EXC ' + (e && e.stack || e)); fails++; finish(); }
})();
</script>
</body></html>
