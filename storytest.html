<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>War Room storyline test</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="team-stripe"></div>
<header class="topbar">
  <button class="brand" data-view="home"><span class="brand-mark"></span><span class="brand-text"><span class="brand-school" id="brandSchool"></span><span class="brand-season" id="brandSeason"></span></span></button>
  <nav class="nav" id="nav">
    <button class="nav-btn" data-view="home">Needs</button>
    <button class="nav-btn" data-view="roster">Roster</button>
    <button class="nav-btn" data-view="board">Board</button>
    <button class="nav-btn" data-view="portal">Portal</button>
    <button class="nav-btn" data-view="class">Class</button>
  </nav>
  <button class="icon-toggle" data-view="settings" id="settingsBtn"></button>
  <button class="icon-toggle" id="themeToggle"></button>
</header>
<main id="view" class="view"></main>
<div id="modal" class="modal-backdrop" hidden></div>
<div id="toast" class="toast" hidden></div>
<pre id="out">RUNNING</pre>
<script>localStorage.clear();</script>
<script src="ocr.js"></script>
<script src="app.js"></script>
<script>
(function () {
  var out = [], fails = 0;
  function render() { document.getElementById('out').textContent = out.join('\n'); }
  function ok(c, name, detail) { out.push((c ? 'PASS ' : 'FAIL ') + name + (c ? '' : '  -- ' + (detail || ''))); if (!c) fails++; render(); }
  function q(s) { return document.querySelector(s); }
  function hits(el) {
    el.scrollIntoView({ block: 'center' });
    var r = el.getBoundingClientRect();
    if (!r.width || !r.height) return 'zero-size';
    var top = document.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2);
    if (!top) return 'nothing at point';
    return (top === el || el.contains(top)) ? true : 'covered by ' + top.tagName.toLowerCase();
  }
  function click(sel) {
    var el = q(sel);
    if (!el) { out.push('NOEL ' + sel); fails++; render(); return false; }
    var h = hits(el);
    ok(h === true, 'clickable: ' + sel, h);
    el.click();
    return true;
  }
  function finish() {
    out.push(fails ? 'RESULT FAIL ' + fails : 'RESULT PASS');
    render();
    try { localStorage.setItem('warroom.testresult', out.join(String.fromCharCode(10))); } catch (e) {}
    window.__done = true;
    if (location.search.indexOf('close') >= 0) setTimeout(function () { window.close(); }, 300);
  }
  var W = window.WarRoom;

  try {
    /* A board with no recruits must not invent stories out of nothing. */
    click('[data-action="load-sample"]');
    var st = W.state();
    ok(st.school.state !== undefined, 'school has a state field');

    /* 1. they generate themselves, with no button pressed */
    var stories = W.stories();
    ok(stories.length >= 2 && stories.length <= 3, 'two or three storylines rolled automatically', stories.length);
    ok(stories.every(function (s) { return s.season === st.season; }), 'all belong to this season');
    var ids = stories.map(function (s) { return s.recruitId; });
    ok(new Set(ids).size === ids.length, 'one storyline per recruit');
    var tpls = stories.map(function (s) { return s.tpl; });
    ok(new Set(tpls).size === tpls.length, 'no template repeats in a season', tpls.join(','));
    ok(stories.every(function (s) { return s.hook && s.hook.length > 40 && s.title; }), 'each has a title and a real hook');
    ok(stories.every(function (s) {
      return st.recruits.some(function (r) { return r.id === s.recruitId && (r.type || 'hs') === 'hs'; });
    }), 'storylines attach only to high-school recruits');

    /* 2. they are stable — re-rendering must not reshuffle them */
    W.setView('board');
    W.setView('home');
    W.setView('board');
    ok(W.stories().map(function (s) { return s.id; }).join() === stories.map(function (s) { return s.id; }).join(),
      'storylines survive re-render unchanged');

    /* 3. they show up on the board and are reachable */
    ok(!!q('.story-card'), 'storyline card renders on the board');
    ok(q('.story-card .story').length !== 0 || document.querySelectorAll('.story').length === stories.length,
      'one block per storyline', document.querySelectorAll('.story').length);
    ok(hits(q('.story-card')) === true, 'storyline card is not covered', hits(q('.story-card')));
    ok(document.querySelectorAll('.story-chip').length >= 1, 'recruits with a story are badged on the board');

    /* the hook must never leak raw HTML from a recruit name */
    var evil = st.recruits[0];
    evil.name = '<img src=x onerror=alert(1)>';
    W.rollStorylines('xss');
    W.setView('board');
    ok(document.querySelectorAll('.story-card img').length === 0, 'recruit names are escaped in storylines');

    /* 4. athletes are gone — the user does not recruit them */
    ok(W.stories().every(function (s) { return s.tpl !== 'athlete'; }), 'no athlete storyline exists any more');

    /* 5. drama is rationed. Roll many seasons and count how often it turns up:
       the point of the feature is that a bad night is an event, not a fixture. */
    var st2 = W.state();
    st2.recruits.forEach(function (r) { r.status = 'board'; });
    var DRAMA = ['injury', 'badnight', 'money', 'flip', 'father', 'blowup', 'bust', 'grades'];
    var dramaSeasons = 0, ROLLS = 60;
    for (var k = 0; k < ROLLS; k++) {
      W.rollStorylines('mix' + k);
      if (W.stories().some(function (s) { return DRAMA.indexOf(s.tpl) >= 0; })) dramaSeasons++;
    }
    var pct = Math.round(dramaSeasons / ROLLS * 100);
    ok(pct >= 15 && pct <= 60, 'drama shows up sometimes, not every season (' + pct + '% of ' + ROLLS + ')', pct + '%');

    /* backstory should be the staple */
    var BACK = ['smallschool', 'secondsport', 'latebloomer', 'filmroom', 'family', 'camp', 'quiet', 'legacy'];
    var backSeen = 0;
    for (k = 0; k < 20; k++) {
      W.rollStorylines('b' + k);
      if (W.stories().some(function (s) { return BACK.indexOf(s.tpl) >= 0; })) backSeen++;
    }
    ok(backSeen >= 18, 'nearly every season has a backstory', backSeen + '/20');

    /* 6. a destructive choice asks first, then really ends the recruitment */
    var dramaStory = null, tries = 0;
    while (!dramaStory && tries < 60) {
      W.rollStorylines('kill' + tries);
      W.stories().forEach(function (s) {
        if (!dramaStory && s.choice && s.choice.options.some(function (o) { return o.status; })) dramaStory = s;
      });
      tries++;
    }
    ok(!!dramaStory, 'a storyline with an offer-pulling choice can be rolled', 'tries=' + tries);
    if (dramaStory) {
      W.setView('board');
      var killOpt = dramaStory.choice.options.filter(function (o) { return o.status; })[0];
      var btn = q('[data-action="story-choice"][data-id="' + dramaStory.id + '"][data-opt="' + killOpt.id + '"]');
      ok(!!btn, 'the destructive option renders');
      ok(btn && btn.classList.contains('danger'), 'it is marked as destructive');
      ok(hits(btn) === true, 'it is clickable', hits(btn));
      btn.click();
      /* it must confirm rather than just do it */
      var confirmBtn = q('#modal [data-action="story-choice"][data-confirmed="1"]');
      ok(!!confirmBtn, 'pulling the offer asks for confirmation first');
      var stillThere = W.state().recruits.filter(function (r) { return r.id === dramaStory.recruitId; })[0];
      ok(stillThere.status !== 'lost', 'nothing happened until it was confirmed', stillThere.status);
      confirmBtn.click();
      var killed = W.state().recruits.filter(function (r) { return r.id === dramaStory.recruitId; })[0];
      ok(killed.status === 'lost', 'confirming really drops the recruit', killed.status);
      var closed = W.stories().filter(function (s) { return s.id === dramaStory.id; })[0];
      ok(closed.state === 'lost', 'and the storyline closes as missed', closed.state);
      ok(/pulled it/i.test(closed.outcome), 'the outcome reflects the choice made', closed.outcome);
    }

    /* 7. a committed-phase story cannot resolve just for being committed */
    var comStory = null; tries = 0;
    while (!comStory && tries < 60) {
      var stx = W.state();
      stx.recruits.forEach(function (r) { r.status = 'committed'; });
      W.rollStorylines('com' + tries);
      W.syncStorylines();
      W.stories().forEach(function (s) { if (!comStory && (s.tpl === 'silent' || s.tpl === 'flip')) comStory = s; });
      tries++;
    }
    ok(!!comStory, 'a committed-phase storyline can be rolled', 'tries=' + tries);
    if (comStory) {
      ok(comStory.state === 'open', 'it stays open while he is merely committed', comStory.state);
      W.state().recruits.filter(function (r) { return r.id === comStory.recruitId; })[0].status = 'signed';
      W.syncStorylines();
      ok(W.stories().filter(function (s) { return s.id === comStory.id; })[0].state === 'won',
        'signing day is what closes it');
    }
    /* reset for the sections below */
    W.state().recruits.forEach(function (r) { r.status = 'board'; });
    W.rollStorylines('reset');
    W.syncStorylines();

    /* 5. committing a recruit closes his story with no extra step */
    var open = W.stories().filter(function (s) { return s.state === 'open'; })[0];
    ok(!!open, 'an open storyline exists to resolve');
    var target = W.state().recruits.filter(function (r) { return r.id === open.recruitId; })[0];
    target.status = 'committed';
    W.setView('board');            /* render alone must NOT resolve it... */
    ok(W.stories().filter(function (s) { return s.id === open.id; })[0].state === 'open',
      'rendering does not silently mutate stored state');
    /* ...the save that any real edit performs does */
    var m = q('[data-action="edit-recruit"][data-id="' + target.id + '"]');
    if (m) { m.click(); click('[data-action="save-recruit"]'); }
    var resolved = W.stories().filter(function (s) { return s.id === open.id; })[0];
    ok(resolved.state === 'won', 'committing closes the storyline as won', resolved.state);
    ok(resolved.outcome && resolved.outcome.length > 10, 'a won storyline gets outcome text', resolved.outcome);

    /* 6. losing one closes it the other way */
    var open2 = W.stories().filter(function (s) { return s.state === 'open'; })[0];
    if (open2) {
      var t2 = W.state().recruits.filter(function (r) { return r.id === open2.recruitId; })[0];
      t2.status = 'lost';
      W.state().players.push({ id: 'x1', name: 'Nudge Save', pos: 'QB', year: 'FR', rs: false, redshirtNow: false, ovr: 0, dev: 'Normal', exit: '', note: '' });
      var m2 = q('[data-view="board"]'); if (m2) m2.click();
      var addBtn = q('[data-action="add-recruit"]');
      if (addBtn) { addBtn.click(); q('#r-name').value = 'Filler Guy'; click('[data-action="save-recruit"]'); }
      var lost = W.stories().filter(function (s) { return s.id === open2.id; })[0];
      ok(lost.state === 'lost', 'losing a recruit closes the storyline as missed', lost.state);
      ok(!!lost.outcome, 'a missed storyline gets outcome text');
    }

    /* 7. advancing settles everything and files it in the history */
    var seasonBefore = W.state().season;
    var storiesBefore = W.stories().length;
    click('[data-view="class"]');
    click('[data-action="advance"]');
    click('[data-action="do-advance"]');
    var st3 = W.state();
    ok(st3.season === seasonBefore + 1, 'season advanced');
    ok(W.stories().length === 0, 'no storylines carried into the new season', W.stories().length);
    var h = st3.history[st3.history.length - 1];
    ok(h.stories && h.stories.length === storiesBefore, 'every storyline filed in the history', (h.stories || []).length + ' vs ' + storiesBefore);
    ok(h.stories.every(function (s) { return s.state === 'won' || s.state === 'lost'; }), 'none left open in the history');
    ok(h.stories.every(function (s) { return !!s.outcome; }), 'each has an outcome in the history');
    click('[data-view="class"]');
    ok(document.querySelectorAll('.story-log-item').length === storiesBefore, 'past classes show the storylines', document.querySelectorAll('.story-log-item').length);

    /* 8. a new season with recruits rolls a fresh set */
    var st4 = W.state();
    ['Alpha One', 'Beta Two', 'Gamma Three'].forEach(function (nm, i) {
      st4.recruits.push({ id: 'n' + i, type: 'hs', name: nm, pos: ['QB', 'WR', 'CB'][i], stars: 4, gem: i === 1,
        rank: 100 + i, state: 'TX', standing: 1, hours: 3, archetype: '', dealbreaker: '', ovr: 0,
        year: 'FR', rs: false, from: '', status: 'board', note: '', dev: 'Normal' });
    });
    var addBtn2 = q('[data-view="board"]'); if (addBtn2) addBtn2.click();
    var ab = q('[data-action="add-recruit"]');
    if (ab) { ab.click(); q('#r-name').value = 'Trigger Save'; click('[data-action="save-recruit"]'); }
    ok(W.stories().length >= 2, 'a new season rolls new storylines once recruits exist', W.stories().length);
    ok(W.stories().every(function (s) { return s.season === st4.season; }), 'they belong to the new season');

    /* 9. re-roll swaps the set */
    var beforeIds = W.stories().map(function (s) { return s.id; }).join();
    click('[data-view="board"]');
    click('[data-action="reroll-stories"]');
    ok(W.stories().map(function (s) { return s.id; }).join() !== beforeIds, 'New set produces different storylines');

    function rec(id, name, pos, stars, status) {
      return { id: id, type: 'hs', name: name, pos: pos, stars: stars, gem: false, bust: false, rank: 100, state: '', standing: 0,
        hours: 0, archetype: '', dealbreaker: '', ovr: 0, year: 'FR', rs: false, from: '', status: status, note: '', dev: 'Normal' };
    }

    /* 10. backstory handed to a recruit who has already committed ends on
       signing day. It used to close as landed on the very next save. */
    var early = null; tries = 0;
    while (!early && tries < 40) {
      W.state().recruits = [rec('e1', 'Board Five', 'QB', 5, 'board'), rec('e2', 'Early Commit', 'WR', 5, 'committed'), rec('e3', 'Board One', 'CB', 1, 'board')];
      W.rollStorylines('early' + tries);
      W.stories().forEach(function (s) { if (!early && s.recruitId === 'e2' && s.tpl !== 'silent' && s.tpl !== 'flip') early = s; });
      tries++;
    }
    ok(!!early, 'a backstory can land on a recruit who already committed', 'tries=' + tries);
    if (early) {
      W.syncStorylines();
      ok(early.state === 'open', 'it stays open after the next save while he is merely committed', early.tpl + ' ' + early.state);
      W.state().recruits[1].status = 'signed';
      W.syncStorylines();
      ok(early.state === 'won', 'and closes when he signs', early.state);
    }
    var signedGot = false;
    for (k = 0; k < 20; k++) {
      W.state().recruits = [rec('s1', 'Already Signed', 'QB', 5, 'signed'), rec('s2', 'Board Two', 'WR', 3, 'board'), rec('s3', 'Board Three', 'CB', 3, 'board')];
      W.rollStorylines('signed' + k);
      if (W.stories().some(function (s) { return s.recruitId === 's1'; })) signedGot = true;
    }
    ok(!signedGot, 'a recruit who has already signed is never given a story');

    /* 11. a New set that cannot make one leaves the season's stories alone */
    W.state().recruits = [rec('p1', 'Pair One', 'QB', 4, 'board'), rec('p2', 'Pair Two', 'WR', 4, 'board')];
    W.rollStorylines('pair');
    var pairIds = W.stories().map(function (s) { return s.id; }).join();
    W.state().recruits[1].status = 'lost';
    W.syncStorylines();
    click('[data-view="board"]');
    click('[data-action="reroll-stories"]');
    click('[data-action="add-slot"][data-pos="TE"]');   /* an ordinary save */
    ok(pairIds && W.stories().map(function (s) { return s.id; }).join() === pairIds, 'a refused New set keeps the season\'s stories',
      pairIds + ' vs ' + W.stories().map(function (s) { return s.id; }).join());

    /* 12. a recruit deleted mid-season takes his story with him rather than
       filing it nameless and open */
    W.state().recruits = [rec('d1', 'Del One', 'QB', 4, 'board'), rec('d2', 'Del Two', 'WR', 4, 'board'), rec('d3', 'Del Three', 'CB', 4, 'board')];
    W.rollStorylines('del');
    var victim = W.stories()[0];
    click('[data-view="board"]');
    click('[data-action="edit-recruit"][data-id="' + victim.recruitId + '"]');
    click('[data-action="delete-recruit"]');
    click('[data-view="class"]');
    click('[data-action="advance"]');
    click('[data-action="do-advance"]');
    var filed = W.state().history[W.state().history.length - 1].stories;
    ok(filed.length === 2 && filed.every(function (s) { return !!s.name && (s.state === 'won' || s.state === 'lost'); }),
      'a deleted recruit\'s story is not filed in the history', JSON.stringify(filed.map(function (s) { return s.name + ':' + s.state; })));

    finish();
  } catch (e) {
    out.push('EXC ' + (e && e.stack || e));
    fails++;
    finish();
  }
})();
</script>
</body>
</html>
