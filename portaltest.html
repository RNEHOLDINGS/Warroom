<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Portal test</title><link rel="stylesheet" href="styles.css"></head>
<body>
<div class="team-stripe"></div>
<header class="topbar">
  <button class="brand" data-view="home"><span class="brand-mark"></span><span class="brand-text"><span class="brand-school" id="brandSchool"></span><span class="brand-season" id="brandSeason"></span></span></button>
  <nav class="nav" id="nav">
    <button class="nav-btn" data-view="home">Needs</button><button class="nav-btn" data-view="roster">Roster</button>
    <button class="nav-btn" data-view="board">Recruiting</button><button class="nav-btn" data-view="portal">Portal</button>
    <button class="nav-btn" data-view="class">Class</button>
  </nav>
  <button class="icon-toggle" data-view="settings" id="settingsBtn"></button>
  <button class="icon-toggle" id="themeToggle"></button>
</header>
<main id="view" class="view"></main>
<div id="modal" class="modal-backdrop" hidden></div>
<div id="toast" class="toast" hidden></div>
<pre id="out">RUNNING</pre>
<script>localStorage.clear();</script>
<script src="ocr.js"></script>
<script src="app.js"></script>
<script>
(function () {
  var out = [], fails = 0;
  function render() { document.getElementById('out').textContent = out.join('\n'); }
  function ok(c, n, d) { out.push((c ? 'PASS ' : 'FAIL ') + n + (c ? '' : '  -- ' + (d || ''))); if (!c) fails++; render(); }
  function q(s) { return document.querySelector(s); }
  function hits(el) {
    el.scrollIntoView({ block: 'center' });
    var r = el.getBoundingClientRect();
    if (!r.width || !r.height) return 'zero-size';
    var t = document.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2);
    if (!t) return 'nothing at point';
    return (t === el || el.contains(t)) ? true : 'covered by ' + t.tagName.toLowerCase();
  }
  function click(sel) {
    var el = q(sel);
    if (!el) { out.push('NOEL ' + sel); fails++; render(); return false; }
    var h = hits(el); ok(h === true, 'clickable: ' + sel, h); el.click(); return true;
  }
  function finish() {
    out.push(fails ? 'RESULT FAIL ' + fails : 'RESULT PASS'); render();
    try { localStorage.setItem('warroom.testresult', out.join(String.fromCharCode(10))); } catch (e) {}
    window.__done = true;
    if (location.search.indexOf('close') >= 0) setTimeout(function () { window.close(); }, 300);
  }
  var W = window.WarRoom;
  try {
    click('[data-action="load-sample"]');
    /* the sample program already ships a couple of departures, so every
       assertion below is a delta rather than an absolute */
    var open0 = W.needs().totals.open;
    var portalOut0 = W.needs().totals.portalOut;

    var st = W.state();
    var guy = st.players.filter(function (p) { return p.year !== 'SR' && !p.exit; })[0];
    var guy2 = st.players.filter(function (p) { return p.year !== 'SR' && !p.exit && p.id !== guy.id; })[0];
    ok(!!guy && !!guy2, 'found two returning players to work with');
    var guyName = guy.name;

    /* --- the tick-list --- */
    click('[data-view="portal"]');
    ok(/Out of the portal/.test(q('#view').textContent), 'portal view shows the outgoing section');
    click('[data-action="portal-picker"]');
    ok(!!q('.pick-list'), 'the tick-list opens');
    var outBox = q('[data-portal="out"][data-id="' + guy.id + '"]');
    var riskBox = q('[data-portal="risk"][data-id="' + guy2.id + '"]');
    ok(!!outBox && !!riskBox, 'every player has both ticks');
    ok(hits(outBox) === true, 'a tick is clickable', hits(outBox));

    /* seniors are already leaving, so offering the tick would be a lie */
    var senior = st.players.filter(function (p) { return p.year === 'SR'; })[0];
    if (senior) {
      var sBox = q('[data-portal="out"][data-id="' + senior.id + '"]');
      ok(sBox && sBox.disabled, 'seniors cannot be ticked');
    }

    /* --- "gone" changes the count --- */
    outBox.checked = true;
    outBox.dispatchEvent(new Event('change', { bubbles: true }));
    var afterOut = W.needs().totals;
    ok(W.state().players.filter(function (p) { return p.id === guy.id; })[0].exit === 'portal', 'ticking Gone marks the exit');
    ok(afterOut.open === open0 + 1, 'a player in the portal opens a scholarship', afterOut.open + ' vs ' + open0);
    ok(afterOut.portalOut === portalOut0 + 1, 'counted as a portal departure', afterOut.portalOut + ' vs ' + portalOut0);

    /* --- "might" does NOT change the count --- */
    riskBox.checked = true;
    riskBox.dispatchEvent(new Event('change', { bubbles: true }));
    var afterRisk = W.needs().totals;
    ok(afterRisk.open === afterOut.open, 'a player who might go still counts as yours', afterRisk.open);
    ok(afterRisk.atRisk === 1, 'but he is counted as at risk', afterRisk.atRisk);
    ok(afterRisk.openIfRisk === afterRisk.open + 1, 'and the if-they-all-go number is shown', afterRisk.openIfRisk);

    /* --- a player cannot be both --- */
    var bothOut = q('[data-portal="out"][data-id="' + guy2.id + '"]');
    bothOut.checked = true;
    bothOut.dispatchEvent(new Event('change', { bubbles: true }));
    var g2 = W.state().players.filter(function (p) { return p.id === guy2.id; })[0];
    ok(g2.exit === 'portal' && g2.risk === false, 'going to the portal clears "might go"', JSON.stringify({ e: g2.exit, r: g2.risk }));
    ok(q('[data-portal="risk"][data-id="' + guy2.id + '"]').checked === false, 'and the other tick clears on screen');

    /* --- unticking puts him back --- */
    bothOut.checked = false;
    bothOut.dispatchEvent(new Event('change', { bubbles: true }));
    ok(W.state().players.filter(function (p) { return p.id === guy2.id; })[0].exit === '', 'unticking returns him to the roster');
    ok(W.needs().totals.open === open0 + 1, 'and the count goes back', W.needs().totals.open);

    click('[data-action="close"]');

    /* --- the screen behind the list is current the moment it closes, with no
       re-navigation: it used to go on saying nobody had left --- */
    ok(q('#view').textContent.indexOf(guyName) >= 0, 'the portal screen lists him as soon as the list closes', guyName);

    /* --- an athlete has no position row, but ticking him Gone still opens his spot --- */
    W.state().players.push({ id: 'ath1', name: 'Ath Leaver', pos: 'ATH', year: 'SO', rs: false, redshirtNow: false, ovr: 75, dev: 'Normal', exit: '', note: '' });
    var athOpen = W.needs().totals.open;
    click('[data-action="portal-picker"]');
    var athBox = q('[data-portal="out"][data-id="ath1"]');
    athBox.checked = true;
    athBox.dispatchEvent(new Event('change', { bubbles: true }));
    ok(W.needs().totals.open === athOpen + 1, 'an athlete ticked Gone opens a scholarship too', athOpen + ' -> ' + W.needs().totals.open);
    athBox.checked = false;
    athBox.dispatchEvent(new Event('change', { bubbles: true }));
    click('[data-action="close"]');
    W.state().players = W.state().players.filter(function (p) { return p.id !== 'ath1'; });

    /* --- it shows where it should --- */
    click('[data-view="portal"]');
    ok(q('#view').textContent.indexOf(guyName) >= 0, 'the departing player is listed on the portal screen', guyName);

    var g3 = W.state().players.filter(function (p) { return p.year !== 'SR' && !p.exit && !p.risk; })[0];
    g3.risk = true;
    click('[data-view="roster"]');
    ok(q('#view').innerHTML.indexOf('Might go') >= 0, 'roster badges a player who might go');
    click('[data-view="home"]');
    ok(/might transfer/.test(q('#view').textContent), 'the needs screen says what happens if they all go');

    /* --- one screen for both -----------------------------------------
       A transfer and a high-school kid are the same decision about the
       same spot, so they belong in one list. Two screens meant checking
       both to see whether a hole was filled. */
    click('[data-view="board"]');
    var scr = function () { return q('#view').textContent; };
    /* Scoped to the list: the storylines card links to the same recruits,
       and counting those as rows made the list look like it held people it
       does not. */
    var rows = function () { return Array.prototype.slice.call(document.querySelectorAll('.list [data-action="edit-recruit"]')); };
    var ids = function () { return rows().map(function (b) { return b.getAttribute('data-id'); }); };
    var kindOf = function (id) {
      var r = W.state().recruits.filter(function (x) { return x.id === id; })[0];
      return r ? (r.type || 'hs') : '?';
    };

    ok(/^Recruiting/m.test(scr()) || scr().indexOf('Recruiting') >= 0, 'the merged screen is called Recruiting', scr().slice(0, 40));
    var shown = ids().map(kindOf);
    ok(shown.indexOf('hs') >= 0 && shown.indexOf('portal') >= 0, 'high-school recruits and transfers are in the one list', JSON.stringify(shown));
    ok(/is a transfer|are transfers/.test(scr()), 'and it says how many of them are transfers', (scr().match(/[^.]*transfer[^.]*/) || [''])[0]);
    var portalRow = rows().filter(function (b) { return kindOf(b.getAttribute('data-id')) === 'portal'; })[0];
    ok(/Portal/.test(portalRow.textContent), 'a transfer says so on its own row, because four stars and 84 OVR are not the same scale', portalRow.textContent);
    /* Saying it is in the row is not the same as the row still being
       readable: as a fourth chip on the right it took the whole width on a
       phone and collapsed the name to nothing, which textContent cannot
       see. The test window is a desktop one, so the phone is what has to
       be measured -- squeeze the view to a phone's width and look. */
    var squeeze = document.createElement('style');
    squeeze.textContent = '#view, #view .card { width: 343px !important; max-width: 343px !important; }';
    document.head.appendChild(squeeze);
    var hsRow = rows().filter(function (b) { return kindOf(b.getAttribute('data-id')) === 'hs' && b.querySelector('.who b').textContent.length > 3; })[0];
    ok(hsRow.getBoundingClientRect().width < 360, 'the phone width really applied, so the next two mean something', hsRow.getBoundingClientRect().width);
    var pName = portalRow.querySelector('.who b').getBoundingClientRect();
    ok(pName.width > 30, 'and at a phone’s width his name is still on screen next to the chips', JSON.stringify(pName));
    ok(portalRow.getBoundingClientRect().height <= hsRow.getBoundingClientRect().height,
      'without the row that carries an OVR number growing taller than the others',
      portalRow.getBoundingClientRect().height + ' vs ' + hsRow.getBoundingClientRect().height);
    squeeze.remove();
    ok(/Out of the portal/.test(scr()), 'who is leaving is on the same screen as who you are signing');
    ok(!!q('[data-action="add-recruit"][data-type="hs"]') && !!q('[data-action="add-recruit"][data-type="portal"]'),
      'both kinds can be added from it');

    /* narrowing to one source */
    var src = q('[data-filter="board.src"]');
    ok(!!src, 'there is a source filter');
    src.value = 'portal';
    src.dispatchEvent(new Event('change', { bubbles: true }));
    ok(ids().length && ids().map(kindOf).every(function (k) { return k === 'portal'; }), 'Portal shows only transfers', JSON.stringify(ids().map(kindOf)));
    ok(!q('[data-action="add-recruit"][data-type="hs"]'), 'and offers the tools that go with it, not the other ones');
    ok(!!q('[data-action="paste-recruits"][data-type="portal"]'), 'including the paste format that matches');
    ok(q('.slot-adder').textContent.indexOf('portal target') >= 0, 'a held spot there is a portal target', q('.slot-adder').textContent);

    q('[data-filter="board.src"]').value = 'hs';
    q('[data-filter="board.src"]').dispatchEvent(new Event('change', { bubbles: true }));
    ok(ids().length && ids().map(kindOf).every(function (k) { return k === 'hs'; }), 'High school shows only recruits', JSON.stringify(ids().map(kindOf)));
    ok(!!q('[data-action="scan-recruits"]'), 'and the board screenshot, which is no use on the portal');
    ok(!/Out of the portal/.test(scr()), 'with the departures out of the way');

    q('[data-filter="board.src"]').value = '';
    q('[data-filter="board.src"]').dispatchEvent(new Event('change', { bubbles: true }));
    var before = W.state().recruits.length;
    click('.slot-adder [data-action="add-slot"][data-pos="QB"]');
    var added = W.state().recruits[W.state().recruits.length - 1];
    ok(W.state().recruits.length === before + 1 && (added.type || 'hs') === 'hs',
      'holding a spot with both showing holds it for a recruit, which is what it nearly always means', added.type);
    W.state().recruits.pop();

    /* the old route still works, because a screen that moved should not
       strand a link to it */
    click('[data-view="portal"]');
    ok(/Transfer portal/.test(scr()) && ids().map(kindOf).every(function (k) { return k === 'portal'; }),
      'the old Portal route opens the merged screen narrowed to the portal', scr().slice(0, 40));
    ok(!q('[data-filter="board.src"]'), 'and does not offer to widen itself, since that is what Recruiting is for');

    /* --- hours are gone ----------------------------------------------
       They were a number you kept in your head and typed twice. */
    click('[data-view="board"]');
    click('[data-action="add-recruit"][data-type="hs"]');
    ok(!q('#r-hours'), 'a recruit has no hours field');
    ok(!/[Hh]ours/.test(q('#modal').textContent), 'and nothing in the form mentions them', q('#modal').textContent.slice(0, 120));
    click('[data-action="close"]');
    click('[data-view="settings"]');
    ok(!q('#s-hours'), 'Settings has no hours-per-week');
    ok(!/[Hh]ours per week|Recruiting hours/.test(scr()), 'and does not ask for them');
    ok(W.state().hours === undefined, 'nor are they kept', JSON.stringify(W.state().hours));
    click('[data-view="board"]');
    ok(!/Hours this week/.test(scr()), 'and the meter is gone from the board');

    /* --- rollover --- */
    click('[data-view="class"]');
    click('[data-action="advance"]');
    click('[data-action="do-advance"]');
    var st2 = W.state();
    ok(st2.players.every(function (p) { return !p.risk; }), 'advancing clears last season worries');
    ok(st2.players.filter(function (p) { return p.name === guyName; }).length === 0, 'the portal player actually left');
    ok(st2.players.every(function (p) { return p.exit === ''; }), 'no exits carried over');
    finish();
  } catch (e) { out.push('EXC ' + (e && e.stack || e)); fails++; finish(); }
})();
</script>
</body></html>
