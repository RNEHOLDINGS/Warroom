<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>voice shot</title><link rel="stylesheet" href="styles.css"></head>
<body>
<div class="team-stripe"></div>
<header class="topbar">
  <button class="brand" data-view="home"><span class="brand-mark"></span><span class="brand-text"><span class="brand-school" id="brandSchool"></span><span class="brand-season" id="brandSeason"></span></span></button>
  <nav class="nav" id="nav">
    <button class="nav-btn" data-view="home">Needs</button><button class="nav-btn" data-view="roster">Roster</button>
    <button class="nav-btn" data-view="board">Board</button><button class="nav-btn" data-view="portal">Portal</button>
    <button class="nav-btn" data-view="class">Class</button><button class="nav-btn" data-view="show">Show</button>
  </nav>
  <button class="icon-toggle" data-view="settings" id="settingsBtn"></button>
  <button class="icon-toggle" id="themeToggle"></button>
</header>
<main id="view" class="view"></main>
<div id="modal" class="modal-backdrop" hidden></div>
<div id="toast" class="toast" hidden></div>
<pre id="printArea" class="print-only"></pre>
<script>localStorage.clear(); localStorage.setItem('warroom.geminiKey','demo');</script>
<script src="ocr.js"></script><script src="voice.js"></script><script src="app.js"></script>
<script>
(function(){
  var q = new URLSearchParams(location.search), W = WarRoom, st = W.state();
  st.school = { name:'North Dakota State', mascot:'Bison', state:'ND', color:'#115740' };
  window.fetch = function(){ var bin=''; for (var i=0;i<24000;i++){ var v=Math.round(Math.sin(i/9)*3000)&0xffff; bin+=String.fromCharCode(v&255,(v>>8)&255);} 
    return Promise.resolve(new Response(JSON.stringify({candidates:[{content:{parts:[{inlineData:{mimeType:'audio/L16;codec=pcm;rate=24000',data:btoa(bin)}}]}}]}),{status:200})); };
  st.games.push({ id:'d1', season:2027, week:4, opponent:'Kansas State', home:true, result:'W', scoreFor:38, scoreAgainst:17,
    yardsFor:505, yardsAgainst:288, toFor:1, toAgainst:3, thirdDown:'9 of 14', penalties:'', notes:'', script:'',
    performances:[{ name:'D.Jewell', pos:'HB', line:'168 yards and 2 scores', verdict:'standout' }] });
  if (q.get('v') === 'settings') { W.setView('settings'); var c=document.querySelector('#sh-key'); if(c) c.scrollIntoView(); return; }
  W.setView('show');
  document.querySelector('[data-action="script"][data-id="d1"]').click();
  if (q.get('v') === 'voiced') document.querySelector('[data-action="voice-script"]').click();
})();
</script></body></html>
